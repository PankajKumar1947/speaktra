services:
  speaktra-api:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Override the port and redis URL for Docker environment
      PORT: 5001
      UPSTASH_REDIS_URL: redis://speaktra-redis:6379
    container_name: speaktra-api
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "5001:5001"

  redis:
    image: redis:alpine
    container_name: speaktra-redis
    restart: always
    ports:
      - "6379:6379"
